version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ws_postgres
    environment:
      POSTGRES_USER: worldsim
      POSTGRES_PASSWORD: worldsim_pass
      POSTGRES_DB: worldsimulation
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U worldsim -d worldsimulation"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ws_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ws_backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://worldsim:worldsim_pass@postgres:5432/worldsimulation
      - REDIS_URL=redis://redis:6379/0
      - KIMI_API_KEY=${KIMI_API_KEY}
      - SIMULATION_SEED=${SIMULATION_SEED:-default}
      - MAX_AGENTS_DEFAULT=8
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ws_celery
    environment:
      - DATABASE_URL=postgresql+asyncpg://worldsim:worldsim_pass@postgres:5432/worldsimulation
      - REDIS_URL=redis://redis:6379/0
      - KIMI_API_KEY=${KIMI_API_KEY}
      - SIMULATION_SEED=${SIMULATION_SEED:-default}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    command: celery -A src.workers.simulation_worker worker --loglevel=info

volumes:
  postgres_data:
  redis_data:
