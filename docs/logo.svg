<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes orbit-1 { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes orbit-2 { from { transform: rotate(0deg); } to { transform: rotate(-360deg); } }
    @keyframes pulse { 0%, 100% { opacity: 0.2; transform: scale(0.98); } 50% { opacity: 0.5; transform: scale(1.02); } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    
    .orbit-1 { animation: orbit-1 60s linear infinite; transform-origin: 300px 200px; }
    .orbit-2 { animation: orbit-2 40s linear infinite; transform-origin: 300px 200px; }
    .core { animation: pulse 4s ease-in-out infinite; transform-origin: 300px 200px; }
    .floating { animation: float 6s ease-in-out infinite; }
    
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  </style>

  <!-- Outer Ring -->
  <circle cx="300" cy="200" r="180" stroke="#F0F0F0" stroke-width="1" stroke-dasharray="10 20" />
  
  <!-- Main Grid -->
  <g class="orbit-1">
    <ellipse cx="300" cy="200" rx="150" ry="60" stroke="#D1D1D1" stroke-width="0.5" />
    <ellipse cx="300" cy="200" rx="60" ry="150" stroke="#D1D1D1" stroke-width="0.5" />
    <circle cx="300" cy="50" r="4" fill="#000" />
    <circle cx="300" cy="350" r="4" fill="#000" />
  </g>

  <!-- Secondary Motion -->
  <g class="orbit-2">
    <ellipse cx="300" cy="200" rx="120" ry="120" stroke="#E5E5E5" stroke-width="0.3" stroke-dasharray="2 2" />
    <circle cx="420" cy="200" r="2.5" fill="#666" />
    <circle cx="180" cy="200" r="2.5" fill="#666" />
  </g>

  <!-- Core Element -->
  <g class="core">
    <circle cx="300" cy="200" r="70" stroke="#000" stroke-width="0.75" />
    <circle cx="300" cy="200" r="60" stroke="#000" stroke-width="0.2" stroke-opacity="0.3" />
  </g>

  <!-- Abstract Simulation Nodes -->
  <circle cx="280" cy="180" r="1.5" fill="#000" />
  <circle cx="320" cy="220" r="1.5" fill="#000" />
  <circle cx="310" cy="185" r="1.5" fill="#000" />
  <path d="M280 180 L310 185 L320 220" stroke="#000" stroke-width="0.2" fill="none" stroke-opacity="0.4" />

</svg>
