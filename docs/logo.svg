<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients -->
    <linearGradient id="g-hist" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#FF4500" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="g-tech" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00EEFF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0077FF" stop-opacity="0.3" />
    </linearGradient>
    
    <!-- Glow Filters -->
    <filter id="glow-gold" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-blue" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes rotate-main { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes rotate-inv { from { transform: rotate(0deg); } to { transform: rotate(-360deg); } }
    @keyframes breath { 0%, 100% { transform: scale(1); opacity: 0.8; } 50% { transform: scale(1.05); opacity: 1; } }
    @keyframes scan { 0% { stroke-dashoffset: 200; } 100% { stroke-dashoffset: 0; } }
    
    .layer-history { animation: rotate-main 45s linear infinite; transform-origin: 300px 200px; }
    .layer-tech { animation: rotate-inv 28s linear infinite; transform-origin: 300px 200px; }
    .core-sphere { animation: breath 7s ease-in-out infinite; transform-origin: 300px 200px; }
  </style>

  <!-- Background Ambience -->
  <circle cx="300" cy="200" r="190" stroke="#F0F0F0" stroke-width="0.5" />

  <!-- Layer: History (Gold) -->
  <g class="layer-history">
    <ellipse cx="300" cy="200" rx="160" ry="50" stroke="url(#g-hist)" stroke-width="2" />
    <ellipse cx="300" cy="200" rx="50" ry="160" stroke="url(#g-hist)" stroke-width="2" />
    <circle cx="300" cy="40" r="6" fill="#FFD700" filter="url(#glow-gold)" />
    <circle cx="300" cy="360" r="6" fill="#FFD700" filter="url(#glow-gold)" />
  </g>

  <!-- Layer: Modern (Blue) -->
  <g class="layer-tech">
    <circle cx="300" cy="200" r="135" stroke="url(#g-tech)" stroke-width="1.5" stroke-dasharray="8 8" style="animation: scan 15s linear infinite;" />
    <circle cx="435" cy="200" r="5" fill="#00EEFF" filter="url(#glow-blue)" />
    <circle cx="165" cy="200" r="5" fill="#00EEFF" filter="url(#glow-blue)" />
  </g>

  <!-- Central Core -->
  <g class="core-sphere">
    <circle cx="300" cy="200" r="80" fill="black" stroke="#222" stroke-width="1" />
    <path d="M265 200 L300 165 L335 200 L300 235 Z" stroke="#FFD700" stroke-width="1" fill="#FFD700" fill-opacity="0.05" />
    <circle cx="300" cy="200" r="3" fill="#00EEFF" filter="url(#glow-blue)" />
  </g>

</svg>
